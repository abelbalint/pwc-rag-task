[project]
name = "pwc-rag-task"
version = "0.1.0"
description = "RAG-based IT helpdesk question-answering backend for the fictional Acme Corp."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-ingest = "app.rag.ingest:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call real LLM/embedding providers (run with -m integration)",
]
